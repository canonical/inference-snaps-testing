name: Test chat

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      test-config:
        description: 'Test configuration to run'
        required: true
        type: string

jobs:
  test:
    name: Test chat
    # Need to use self-hosted private endpoint runner to access Testflinger
    runs-on: self-hosted-linux-amd64-jammy-private-endpoint-medium

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Download Go modules
        run: go mod download

      - name: Run tests
        run: |
          go run ./cmd/test-chat ${{ inputs.test-config }}

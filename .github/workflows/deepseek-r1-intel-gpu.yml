name: deepseek-r1 intel-gpu

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      snap-channel:
        description: 'Snap store channel to test'
        required: true
        type: string

jobs:
  test-chat:
    uses: ./.github/workflows/test-chat.yml
    with:
      snap-name: deepseek-r1
      snap-channel: ${{ inputs.snap-channel }}
      job-queue: 202305-31589 # Alder Lake, GPU 8086:4692
      provision-data: "distro: noble"
      expected-engine: ""
      select-engine: "intel-gpu"
      expected-tps: 0
      install-nvidia-driver-version: ""

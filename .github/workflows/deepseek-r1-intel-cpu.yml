name: deepseek-r1 intel-cpu

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      snap-channel:
        description: 'Snap store channel to test'
        required: true
        type: string

jobs:
  test-chat:
    uses: ./.github/workflows/test-chat.yml
    with:
      snap-name: deepseek-r1
      snap-channel: ${{ inputs.channel }}
      job-queue: 202409-35842 # ProLiant DL360 Gen9 with Intel(R) Xeon(R) CPU E5-2690 v3 @ 2.60GHz
      provision-data: "distro: noble"
      expected-engine: ""
      select-engine: "intel-cpu"
      expected-tps: 0
      install-nvidia-driver-version: ""
